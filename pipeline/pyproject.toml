[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prathik Shetty", email = "prathikkshetty15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
